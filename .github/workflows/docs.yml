# Builds the documentation (Sphinx + FORD) and publishes the static site to the `site` branch.
# Plesk pulls that branch into the web space of thistle.kirrander.group (Git repository with
# automatic deployment; its webhook is registered on this GitHub repository).
#
# Pull requests only build, as a check; pushes to main also publish.  "Run workflow" in the
# Actions tab republishes by hand.
name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "python/**"
      - "src/fortran/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write          # to push the site branch

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gfortran

      - name: Build the Fortran library (so that pyxscat._lib is documented, not mocked)
        run: make

      - name: Install the documentation tools
        run: pip install -r docs/requirements.txt

      - name: Build the site (Sphinx runs FORD into docs/_ford and copies it to fortran/)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Publish to the site branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site
          publish_dir: docs/_build/html
          force_orphan: true           # the branch keeps only the latest build, no history
          commit_message: "docs: ${{ github.sha }}"
