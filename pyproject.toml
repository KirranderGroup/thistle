[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thistle"
version = "0.2.0.dev0"
description = "THISTLE: ab initio X-ray and electron scattering from electronic wavefunctions (kernels: pyxscat)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
authors = [
    { name = "Andrés Moreno Carrascosa" },
    { name = "Mats Simmermacher" },
    { name = "Patrick Yuheng Wang" },
    { name = "Eirik Moen Liane" },
    { name = "Joseph Cooper" },
    { name = "Nikola Zotev" },
    { name = "Thomas Northey" },
    { name = "Adam Kirrander" },
]
dependencies = ["numpy>=1.24", "matplotlib>=3.6", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
pyxscat = "pyxscat.cli:main"
thistle = "thistle.inputfile:main"

[project.optional-dependencies]
pyscf = ["pyscf>=2.4"]
iam = ["pyscf>=2.4", "scipy>=1.15", "xraydb"]
test = ["pytest", "pyscf>=2.4", "scipy>=1.15", "xraydb"]
all = ["pyscf>=2.4", "scipy>=1.15", "xraydb"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
pyxscat = ["libpyxscat.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
